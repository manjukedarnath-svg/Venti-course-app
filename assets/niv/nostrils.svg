<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1030" width="800" height="1030"><rect width="800" height="1030" fill="#F3EDE3"/><text x="400.0" y="50" font-size="22" fill="#6E6A63" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Seen from below: two nostrils, two prongs</text><ellipse cx="97.30000000000001" cy="220" rx="44.199999999999996" ry="66.3" fill="#EAE3D8" stroke="#1B1A17" stroke-width="3"/><ellipse cx="97.30000000000001" cy="220" rx="28.5" ry="42.7" fill="color-mix(in oklab, #B04428 35%, transparent)" stroke="#B04428" stroke-width="3"/><ellipse cx="202.7" cy="220" rx="44.199999999999996" ry="66.3" fill="#EAE3D8" stroke="#1B1A17" stroke-width="3"/><ellipse cx="202.7" cy="220" rx="28.5" ry="42.7" fill="color-mix(in oklab, #B04428 35%, transparent)" stroke="#B04428" stroke-width="3"/><path d="M146 152.0 L146 288.0 M154 152.0 L154 288.0" fill="none" stroke="#6E6A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="300" y="160" font-size="36" fill="#1B1A17" text-anchor="start" style="font-family:'Instrument Serif', Georgia, serif;">High-flow cannula</text><text x="300" y="194" font-size="20" fill="#B04428" text-anchor="start" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Visible gap</text><text x="300" y="240" font-size="24" fill="#1B1A17" text-anchor="start" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Visible gap around each prong</text><text x="300" y="276" font-size="24" fill="#6E6A63" text-anchor="start" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Leaks by design: gas escapes</text><text x="300" y="312" font-size="24" fill="#6E6A63" text-anchor="start" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Flow and FiO₂ are set, not pressure</text><ellipse cx="97.30000000000001" cy="520" rx="44.199999999999996" ry="66.3" fill="#E