<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="800" height="840"><rect width="800" height="840" fill="#F3EDE3"/><text x="30" y="50" font-size="36" fill="#B04428" text-anchor="start" style="font-family:'Instrument Serif', Georgia, serif;">High-flow</text><rect x="30" y="130" width="170" height="64" rx="8" fill="#EAE3D8" stroke="#1B1A17" stroke-width="3"/><text x="115.0" y="170.0" font-size="24" fill="#1B1A17" text-anchor="middle" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Blender</text><text x="115.0" y="220" font-size="17" fill="#6E6A63" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Flow · FiO₂</text><rect x="290" y="130" width="200" height="64" rx="8" fill="#EAE3D8" stroke="#1B1A17" stroke-width="3"/><text x="390.0" y="170.0" font-size="24" fill="#1B1A17" text-anchor="middle" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Humidifier</text><text x="390.0" y="220" font-size="17" fill="#6E6A63" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">37 °C</text><rect x="580" y="130" width="190" height="64" rx="8" fill="#EAE3D8" stroke="#1B1A17" stroke-width="3"/><text x="675.0" y="170.0" font-size="24" fill="#1B1A17" text-anchor="middle" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Cannula</text><text x="675.0" y="220" font-size="17" fill="#6E6A63" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Nose</text><path d="M200 162 L290 162" fill="none" stroke="#1B1A17" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M490 162 L580 162" fill="none" stroke="#1B1A17" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M229 132 L261 132 L255 158 L235 158 Z" fill="color-mix(in oklab, #3E7D4F 30%, transparent)" stroke="#3E7D4F" stroke-width="3"/><path d="M233 116 l8 9 l16 -18" fill="none" stroke="#3E7D4F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="245" y="100" font-size="18" fill="#3E7D4F" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Mesh here</text><path d="M659 96 L691 96 L685 122 L665 122 Z" fill="color-mix(in oklab, #B42318 30%, transparent)" stroke="#B42318" stroke-width="3"/><path d="M665 74 l20 14 M685 74 l-20 14" fill="none" stroke="#B42318" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="675" y="64" font-size="18" fill="#B42318" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Mask over it</text><text x="30" y="270" font-size="24" fill="#1B1A17" text-anchor="start" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Keep the high-flow running and the humidifier on.</text><text x="30" y="306" font-size="24" fill="#6E6A63" text-anchor="start" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Mesh nebuliser at the humidifier inlet: no extra gas.</text><text x="30" y="342" font-size="24" fill="#6E6A63" text-anchor="start" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">A spacer close to the cannula, plume to the child.</text><text x="30" y="440" font-size="36" fill="#B04428" text-anchor="start" style="font-family:'Instrument Serif', Georgia, serif;">NIV · single limb</text><rect x="30" y="540" width="160" height="64" rx="8" fill="#EAE3D8" stroke="#1B1A17" stroke-width="3"/><text x="110.0" y="580.0" font-size="24" fill="#1B1A17" text-anchor="middle" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Bilevel</text><text x="110.0" y="630" font-size="17" fill="#6E6A63" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Turbine</text><rect x="610" y="540" width="160" height="64" rx="8" fill="#EAE3D8" stroke="#1B1A17" stroke-width="3"/><text x="690.0" y="580.0" font-size="24" fill="#1B1A17" text-anchor="middle" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Mask</text><text x="690.0" y="630" font-size="17" fill="#6E6A63" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Non-vented</text><path d="M190 572 L610 572" fill="none" stroke="#1B1A17" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="420" y="557" width="60" height="30" rx="6" fill="#F3EDE3" stroke="#6E6A63" stroke-width="2.5"/><text x="450" y="628" font-size="17" fill="#6E6A63" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Leak port</text><path d="M529 542 L561 542 L555 568 L535 568 Z" fill="color-mix(in oklab, #3E7D4F 30%, transparent)" stroke="#3E7D4F" stroke-width="3"/><path d="M533 526 l8 9 l16 -18" fill="none" stroke="#3E7D4F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="545" y="510" font-size="18" fill="#3E7D4F" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Here</text><path d="M274 542 L306 542 L300 568 L280 568 Z" fill="color-mix(in oklab, #B42318 30%, transparent)" stroke="#B42318" stroke-width="3"/><path d="M280 520 l20 14 M300 520 l-20 14" fill="none" stroke="#B42318" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="290" y="510" font-size="18" fill="#B42318" text-anchor="middle" style="font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase;">Not here</text><text x="30" y="690" font-size="24" fill="#1B1A17" text-anchor="start" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Do not take the mask off to nebulise.</text><text x="30" y="726" font-size="24" fill="#6E6A63" text-anchor="start" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">Mesh nebuliser between the leak port and the mask;</text><text x="30" y="762" font-size="24" fill="#6E6A63" text-anchor="start" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">a spacer there too, fired at the start of a breath.</text><text x="30" y="798" font-size="24" fill="#6E6A63" text-anchor="start" style="font-family:'Hanken Grotesk', system-ui, sans-serif;">A jet nebuliser adds gas: VT, FiO₂ and trigger change.</text></svg>