<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VentCourse · Live simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./vent-graphics.js"></script>
<script src="./physio.js"></script>
<script src="./sim-data.js"></script>
</head>
<body style="margin:0; background:#0B0D0F; color:#E8E4DC; font-family:'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing:antialiased;">
<div id="app"></div>
<script>
/* VentCourse live simulation. One room, three screens (the role comes from the link):
     sim.html#control-ROOM   the facilitator: case text, stages, orders, events, investigations, log and debrief
     sim.html#vent-ROOM      the ventilator (or the oxygen / high-flow / NIV device): participants change the settings here
     sim.html#monitor-ROOM   the patient monitor, with results (gas, X-ray, POCUS) when the facilitator releases them
   Every change goes to the server with its time (/api/sim), and every screen computes the same patient from that history
   with physio.js, calibrated to each stage of the script. Numbers settle over time after a change. */
(() => {
const $ = s => document.querySelector(s), app = $('#app');
const MONO = "font-family:'IBM Plex Mono', monospace;";
const [ROLE, ROOM] = (() => { const m = location.hash.slice(1).match(/^(control|vent|monitor)-([A-Za-z0-9]{3,8})$/); return m ? [m[1], m[2].toUpperCase()] : [null, null]; })();
const CASES = (window.SIM_DATA || { cases: [] }).cases;
const esc = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmt = (x, d = 0) => (x === null || x === undefined || isNaN(x)) ? '––' : Number(x).toFixed(d);
const post = (r, b) => fetch('/api/sim/' + r, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(x => x.json().then(j => ({ ok: x.ok, j }))).catch(() => ({ ok: false, j: {} }));
let S = null, VER = 0, OFF = 0, KEY = null, lastOk = 0;
try { KEY = localStorage.getItem('vc-sim-key-' + ROOM); } catch (e) {}
const now = () => Date.now() + OFF;
const listeners = [];
async function poll() {
  if (!ROOM) return;
  const r = await post('get', { room: ROOM, v: VER });
  if (r.ok) { lastOk = Date.now(); OFF = r.j.now - Date.now(); if (!r.j.same) { S = r.j.s; VER = r.j.v; TCACHE.clear(); listeners.forEach(f => f()); } }
}
async function act(a) { const r = await post('act', { room: ROOM, key: KEY, act: a }); await poll(); return r; }

// ── settings: the same encoding as the phones ("VENT:PRVC:vt=75,pe=7,…") ──
const MODES = {
  VENT: [['PRVC', 'PRVC'], ['VC', 'Volume control'], ['PC', 'Pressure control'], ['PS', 'Pressure support'], ['STBY', 'Standby']],
  NIV: [['CPAP', 'CPAP'], ['ST', 'Bilevel ST']], HFNC: [['HFNC', 'High-flow']], MASK: [['Mask', 'Oxygen mask']]
};
const IFN = { VENT: 'Ventilator', NIV: 'NIV', HFNC: 'High-flow', MASK: 'Oxygen' };
const KN = {
  PRVC: [['vt', 'VT', 'mL', 10, 700, 5], ['rr', 'Rate', '/min', 4, 70, 1], ['ti', 'Ti', 's', 0.3, 2, 0.05], ['pe', 'PEEP', 'cmH₂O', 0, 25, 1], ['o', 'FiO₂', '%', 21, 100, 5]],
  VC: [['vt', 'VT', 'mL', 10, 700, 5], ['rr', 'Rate', '/min', 4, 70, 1], ['ti', 'Ti', 's', 0.3, 2, 0.05], ['pe', 'PEEP', 'cmH₂O', 0, 25, 1], ['o', 'FiO₂', '%', 21, 100, 5]],
  PC: [['pi', 'Pinsp', 'cmH₂O', 4, 40, 1], ['rr', 'Rate', '/min', 4, 70, 1], ['ti', 'Ti', 's', 0.3, 2, 0.05], ['pe', 'PEEP', 'cmH₂O', 0, 25, 1], ['o', 'FiO₂', '%', 21, 100, 5]],
  PS: [['ps', 'PS', 'cmH₂O', 0, 30, 1], ['pe', 'PEEP', 'cmH₂O', 0, 25, 1], ['o', 'FiO₂', '%', 21, 100, 5]],
  STBY: [],
  CPAP: [['cp', 'CPAP', 'cmH₂O', 3, 15, 1], ['o', 'FiO₂', '%', 21, 100, 5]],
  ST: [['ip', 'IPAP', 'cmH₂O', 4, 30, 1], ['ep', 'EPAP', 'cmH₂O', 3, 15, 1], ['br', 'Backup rate', '/min', 0, 60, 1], ['ti', 'Ti', 's', 0.3, 1.5, 0.05], ['o', 'FiO₂', '%', 21, 100, 5]],
  HFNC: [['f', 'Flow', 'L/min', 1, 60, 1], ['o', 'FiO₂', '%', 21, 100, 5]],
  Mask: [['l', 'O₂ flow', 'L/min', 0, 15, 1]]
};
const DEF = { vt: 100, rr: 20, ti: 0.7, pe: 5, o: 100, pi: 15, ps: 10, cp: 5, ip: 12, ep: 5, br: 20, f: 20, l: 10 };
const parse = x => { if (!x) return null; if (typeof x === 'object') return { iface: x.iface, mode: x.mode, v: { ...(x.v || {}) } };
  const [iface, mode, kv] = String(x).split(':'), v = {}; (kv || '').split(',').forEach(p => { const [k, y] = p.split('='); if (k) v[k] = +y; }); return { iface, mode, v }; };
const enc = s => s.iface + ':' + s.mode + ':' + (KN[s.mode] || []).map(([k, , , , , st]) => k + '=' + (+(s.v[k] ?? DEF[k])).toFixed(st < 1 ? 2 : 0).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '')).join(',');
const readSet = s => { if (!s) return 'Nothing set'; const k = KN[s.mode] || []; const m = ((MODES[s.iface] || []).find(x => x[0] === s.mode) || [0, s.mode])[1];
  return (s.iface === 'VENT' ? '' : IFN[s.iface] + ' · ') + m + (k.length ? ' · ' + k.map(([kk, l]) => l + ' ' + (kk === 'o' ? ((s.v[kk] ?? DEF[kk]) / 100).toFixed(2) : (s.v[kk] ?? DEF[kk]))).join(' · ') : ''); };

// ── the world at each moment, replayed from the history ──
const caseOf = id => CASES.find(c => c.id === id);
function worlds() {
  const out = []; let w = { case: null, stage: 0, set: null, mods: {}, debt: 0 };
  for (const h of (S && S.hist) || []) {
    w = { ...w };
    if (h.kind === 'reset') w = { case: h.case || w.case, stage: 0, set: h.set || null, mods: {}, debt: 0 };
    if (h.case !== undefined) w.case = h.case; if (h.stage !== undefined) w.stage = h.stage; if (h.set !== undefined) w.set = h.set;
    if (h.mods !== undefined) w.mods = h.mods; if (h.debt !== undefined) w.debt = h.debt;
    out.push({ at: h.at, w, h });
  }
  return out;
}
const curWorld = () => { const W = worlds(); return W.length ? W[W.length - 1].w : null; };

// severity of a support against the stage's safe ranges (the same grades as the live deck and the phones)
const GL = { vt: 'VT', pe: 'PEEP', rr: 'Rate', ti: 'Ti', o: 'FiO₂', pi: 'Pinsp', cp: 'CPAP', ep: 'EPAP', ip: 'IPAP', ps: 'PS', te: 'Expiratory time' };
function grade(rule, set) {
  if (!rule || !set) return null; const v = { ...set.v };
  let sev = rule.iface && rule.iface[set.iface] !== undefined ? rule.iface[set.iface] : 2; const why = [];
  if (sev >= 2) why.push(IFN[set.iface] + ' is not the support for this child now');
  if (set.iface === 'VENT' || set.iface === 'NIV') { const K = rule.knobs || {};
    if (v.rr && v.ti && K.te) v.te = +(60 / v.rr - v.ti).toFixed(1);
    for (const k in K) { if (v[k] === undefined) continue; const [lo, hi, blo, bhi] = K[k], x = v[k];
      const g = x < blo || x > bhi ? 3 : x < lo || x > hi ? 2 : 0; if (g) { why.push((GL[k] || k) + ' ' + x + (x < lo ? ' too low' : ' too high') + ' (aim ' + lo + '–' + hi + ')'); sev = Math.max(sev, g); } } }
  return { sev, why };
}

// ── the patient for one world: physio.js, calibrated to the stage, with orders and events on top ──
const CAL = {}, TCACHE = new Map();
function target(w) {
  const k = JSON.stringify(w); if (TCACHE.has(k)) return TCACHE.get(k);
  const C = caseOf(w.case); if (!C) return null;
  const st = C.stages[clamp(w.stage, 0, C.stages.length - 1)], P0 = st.phys, m = w.mods || {}, V = window.VCPhysio;
  const anc = P0 ? P0.anc : { mon: st.mon, gas: {} }, mon0 = anc.mon || [];
  const mv = key => { const r = mon0.find(([x]) => x.replace(/₂/g, '2').startsWith(key)); return r ? parseFloat(r[1]) : NaN; };
  const bp0 = ((mon0.find(([x]) => /BP/.test(x)) || [])[1] || '90/55').match(/(\d+)\s*\/\s*(\d+)/) || [0, 90, 55];
  const base = { HR: mv('HR') || 140, SpO2: isNaN(mv('SpO2')) ? 92 : mv('SpO2'), sys: +bp0[1], dia: +bp0[2], RR: mv('RR') || 30, Temp: mv('Temp') || 37.5 };
  const g0 = (anc.gas || {});
  let set = parse(w.set);
  const out = { stage: st, set, flags: [], mech: null, sc: null };
  const debt = w.debt || 0, dS = [0, 0, -8, -18][debt] || 0, dH = [0, 0, 10, 25][debt] || 0;
  const bagged = st.intub && (!set || set.iface !== 'VENT' || set.mode === 'STBY');
  if (!P0 || !V || bagged) {   // no physiology for this stage, or the team is hand-bagging: the script's own numbers
    Object.assign(out, { HR: base.HR + dH, SpO2: base.SpO2, sys: base.sys + dS, dia: base.dia + dS * 0.6, RR: base.RR, Temp: base.Temp,
      pH: g0.pH ?? 7.3, PaCO2: g0['PaCO₂'] ?? 50, PaO2: g0['PaO₂'] ?? 65, EtCO2: (g0['PaCO₂'] ?? 50) - 8, bagged });
    if (bagged) out.flags.push('Hand-bagging: the ventilator is on standby');
    TCACHE.set(k, out); return out;
  }
  const ck = st.id; if (!CAL[ck]) CAL[ck] = V.calibrate(P0, { set: P0.anc.set, gas: P0.anc.gas, bp: bp0[1] + '/' + bp0[2], spo2: base.SpO2 });
  const cal = CAL[ck];
  // orders and events
  let Rf = Math.pow(0.85, Math.min(4, m.bd || 0)) * (m.plug ? 1.8 : 1);
  const Pm = { ...P0, R: P0.R * Rf, own: (m.para ? 0 : P0.own), trig: (m.para || m.sed) ? undefined : (m.fight ? Math.max(P0.trig || 0, 60) : P0.trig) };
  const qx = cal.qx + 0.02 * debt + (m.prone ? -0.08 : 0) + (m.ino ? -0.04 : 0) + (m.ptx ? 0.12 : 0) + (C.kind === 'ards' ? 0.01 * Math.max(0, (m.fluid || 0) - 1) : 0);
  const calm = { ...cal, qx, cUnit: cal.cUnit * (m.ptx ? 0.6 : 1), K: { ...cal.K, pms: cal.K.pms + 1.5 * (m.fluid || 0) + (m.ino_tr ? 2.5 : 0) - (m.ptx ? 5 : 0) - (m.dry ? 3 : 0) } };
  if (!set) set = parse(P0.anc.set);
  const off = m.off || m.dislodged;
  const runSet = off ? { iface: 'MASK', mode: 'Mask', v: { l: m.dislodged ? 2 : 0 } } : set;
  let r; try { r = V.run(Pm, calm, runSet); } catch (e) { r = null; }
  if (!r) { TCACHE.set(k, out); return out; }
  const spBase = base.SpO2, sp = clamp(spBase + r.dSat - (debt >= 2 ? 2 * (debt - 1) : 0), 30, 100);
  const hr = clamp(base.HR * (1 + 0.35 * (1 - r.mapBp / r.mapBpA)) + 1.2 * Math.max(0, -r.dSat) - 0.5 * Math.max(0, r.dSat) + 0.25 * (r.paco2 - cal.ref.paco2) + dH - (m.sed || m.para ? 8 : 0) + (m.fight ? 25 : 0), 50, 230);
  const s = r.sup, vt = s.vt || 0, apnoea = (s.rr || 0) < 1;
  const et = (off || apnoea) ? 0 : clamp(r.paco2 * (1 - (r.vdAlv || 0) / Math.max(1, vt)) - (C.kind === 'asthma' ? 10 : 4), 0, 140);
  Object.assign(out, { HR: hr, SpO2: sp, sys: r.sys + dS, dia: r.dia + dS * 0.6, RR: off && m.para ? 0 : s.rr, Temp: base.Temp, pH: r.ph, PaCO2: r.paco2, PaO2: r.pa, EtCO2: et, HCO3: 0.03 * cal.ref.paco2 * Math.pow(10, (g0.pH || 7.3) - 6.1),
    coRel: r.coRel, oi: r.oi, pf: r.pf, qs: r.qs, sup: s, C: r.C, set: runSet, off });
  // the breath on the ventilator screen
  if (!off && (set.iface === 'VENT' || set.iface === 'NIV')) {
    const v = set.v, R = Pm.R, tau = R * r.C / 1000;
    let sc;
    if (set.iface === 'NIV' || set.mode === 'PS') {
      const pe = set.mode === 'CPAP' ? (v.cp ?? 5) : (v.ep ?? v.pe ?? 5), ps = set.mode === 'CPAP' ? 0 : set.mode === 'PS' ? (v.ps ?? 8) : Math.max(0, (v.ip ?? pe) - pe), rr = Math.max(1, s.rr);
      sc = { mode: 'PS', ps, peep: pe, C: r.C, R, rr, window: +(3 * 60 / rr).toFixed(2), efforts: apnoea ? [] : [0, 1, 2].map(i => ({ t: +(0.22 + i * 60 / rr).toFixed(3), amp: 7, dur: Math.min(0.5, 25 / rr) })) };
      if (apnoea) sc.breaths = [];
    } else {
      const rr = s.rr, ti = Math.min(v.ti ?? 0.7, 60 / rr - 0.15);
      sc = { C: r.C, R, peep: v.pe ?? 0, rr, ti, window: +(3 * 60 / rr).toFixed(2) };
      if (set.mode === 'PC') Object.assign(sc, { mode: 'PC', pinsp: v.pi ?? 15 });
      else if (set.mode === 'VC') Object.assign(sc, { mode: 'VC', vt, pause: 0.1 });
      else Object.assign(sc, { mode: 'PC', pinsp: clamp(vt / r.C / (1 - Math.exp(-ti / Math.max(0.02, tau))), 4, 38) });
      if (C.kind === 'asthma') sc.efl = { k: 0.6, m: 5 };
      if (Pm.trig && Pm.trig > rr - 1) sc.efforts = [0, 1, 2].map(i => ({ t: +(0.15 + i * 60 / rr).toFixed(3), amp: m.fight ? 9 : 4, dur: 0.4 }));
    }
    sc.scale = { v: Math.round(C.kg * 14) };
    let stats = null; try { const sim = window.VentGraphics.simulate(sc); let mm = 0; for (let i = 0; i < sim.p.length; i++) mm += sim.p[i]; stats = { pip: sim.stats.pip, map: mm / sim.p.length, vt: sim.stats.vt }; } catch (e) {}
    out.sc = sc;
    out.mech = { peak: (stats ? stats.pip : s.pEnd) + (s.auto || 0) + (m.plug ? 8 : 0), plat: s.pEnd, peepSet: s.peep, peepTot: s.peep + (s.auto || 0), vte: s.limited ? vt : (stats ? stats.vt : vt), map: stats ? stats.map : s.mapAw,
      rr: s.rr, mve: (s.rr * (s.limited ? vt : (stats ? stats.vt : vt))) / 1000, C: r.C, limited: s.limited };
  }
  // safety alarms the facilitator should see
  if (out.mech) { if (out.mech.plat > 30) out.flags.push('Plateau ' + fmt(out.mech.plat, 0) + ' above 30'); if (out.mech.plat - out.mech.peepTot > 15) out.flags.push('Driving pressure ' + fmt(out.mech.plat - out.mech.peepTot, 0) + ' above 15'); if (s.auto > 5) out.flags.push('Auto-PEEP ' + fmt(s.auto, 0)); if (vt > 9 * C.kg) out.flags.push('VT ' + fmt(vt / C.kg, 1) + ' mL/kg'); }
  if (r.coRel < 0.75) out.flags.push('Cardiac output down ' + Math.round((1 - r.coRel) * 100) + '%');
  if (off) out.flags.push(m.dislodged ? 'Tube out: no ventilation' : 'Off the ventilator');
  TCACHE.set(k, out); return out;
}
// what the monitor shows now: each number moves toward its new value with its own time constant (oxygen ~30 s, CO₂ ~90 s, circulation ~10 s)
const TAU = { SpO2: 30, PaO2: 30, HR: 10, sys: 10, dia: 10, RR: 3, EtCO2: 60, PaCO2: 90, pH: 90 };
function shown() {
  const W = worlds(); if (!W.length) return null; const t = now(); let cur = null;
  for (let i = 0; i < W.length; i++) {
    const T = target(W[i].w); if (!T) continue;
    if (!cur || W[i].h.kind === 'stage' || W[i].h.kind === 'reset') { cur = { ...T }; if (i + 1 < W.length || true) { /* time has passed between stages: start from the stage's own numbers */ } continue; }
    const end = i + 1 < W.length ? W[i + 1].at : t, dt = Math.max(0, (end - W[i].at) / 1000);
    const nx = { ...T };
    for (const k in TAU) if (typeof T[k] === 'number' && typeof cur[k] === 'number') nx[k] = T[k] + (cur[k] - T[k]) * Math.exp(-dt / TAU[k]);
    cur = nx;
  }
  if (W.length === 1 && cur) return cur;
  return cur;
}

// ════════════════════════════ LANDING ════════════════════════════
function landing() {
  document.body.style.background = '#F3EDE3'; document.body.style.color = '#1B1A17';
  app.innerHTML = `<main style="max-width:760px; margin:0 auto; padding:48px 20px; display:flex; flex-direction:column; gap:22px;">
    <span style="${MONO} font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#6E6A63;">VentCourse · live simulation</span>
    <h1 style="margin:0; font:400 54px/1 'Instrument Serif', serif;">Run a <em>simulation</em></h1>
    <p style="margin:0; font-size:18px; line-height:1.6; color:#3B3A36;">Three screens share one room: the facilitator's panel (this laptop), the ventilator (a tablet or laptop the team touches) and the patient monitor (a screen the whole team can see). The team gets the case, sets the support and gives orders; the patient follows what they do.</p>
    <label style="display:flex; flex-direction:column; gap:8px; font-size:15px;">Room code (3–8 letters or numbers)
      <input id="rc" value="SIM1" style="font:500 22px 'IBM Plex Mono', monospace; padding:12px 14px; border:1px solid #D2C5B1; border-radius:4px; background:#fff; text-transform:uppercase; width:220px;"></label>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <button id="mk" style="font:500 17px 'Hanken Grotesk'; padding:14px 22px; border:0; border-radius:999px; background:#1B1A17; color:#F3EDE3; cursor:pointer;">Open the facilitator panel</button>
      <button id="jv" style="font:500 17px 'Hanken Grotesk'; padding:14px 22px; border:1px solid #1B1A17; border-radius:999px; background:transparent; cursor:pointer;">This is the ventilator</button>
      <button id="jm" style="font:500 17px 'Hanken Grotesk'; padding:14px 22px; border:1px solid #1B1A17; border-radius:999px; background:transparent; cursor:pointer;">This is the patient monitor</button>
    </div>
    <p style="margin:0; font-size:15px; line-height:1.6; color:#6E6A63;">Open the facilitator panel first. Then, on the other two devices, open sim.html, type the same code and choose their role (or use the links the panel shows).</p></main>`;
  const code = () => ($('#rc').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  $('#mk').onclick = async () => { const c = code(); if (c.length < 3) return;
    const g = await post('get', { room: c }), old = g.ok && g.j.s && g.j.s.case ? caseOf(g.j.s.case) : null;
    const fresh = !old || confirm('Room ' + c + ' already has a session running (' + old.name + ', stage ' + (g.j.s.stage + 1) + ').\n\nOK = start a NEW session (clears it)\nCancel = continue the old one');
    const r = await post('create', { room: c, reset: !!(old && fresh) }); if (r.ok) { try { localStorage.setItem('vc-sim-key-' + c, r.j.key); } catch (e) {} location.hash = 'control-' + c; location.reload(); } };
  $('#jv').onclick = () => { const c = code(); if (c.length >= 3) { location.hash = 'vent-' + c; location.reload(); } };
  $('#jm').onclick = () => { const c = code(); if (c.length >= 3) { location.hash = 'monitor-' + c; location.reload(); } };
}

// ════════════════════════════ PATIENT MONITOR ════════════════════════════
function monitor() {
  document.body.style.overflow = 'hidden';
  app.innerHTML = `<div style="position:fixed; inset:0; display:flex; flex-direction:column; background:#050607;">
    <div style="flex:none; display:flex; align-items:center; gap:20px; padding:8px 18px; ${MONO} font-size:14px; color:#9A968E; border-bottom:1px solid #1C1F22;">
      <span id="mPt" style="color:#E8E4DC;">No patient</span><span id="mStage"></span><span style="flex:1"></span>
      <span id="mAl" style="padding:4px 12px; border-radius:3px; font-weight:600; letter-spacing:.06em;"></span>
      <button id="mSnd" style="${MONO} font-size:13px; background:#1C1F22; color:#E8E4DC; border:1px solid #33373B; border-radius:3px; padding:6px 10px; cursor:pointer;">Sound off</button>
      <span id="mClock"></span></div>
    <div style="flex:1; min-height:0; display:flex;">
      <div style="flex:1; min-width:0; display:grid; grid-template-columns:minmax(0,1fr) 300px; grid-template-rows:repeat(4, minmax(0,1fr));" id="mGrid"></div>
      <div id="mRes" style="flex:none; width:0; overflow:auto; border-left:1px solid #1C1F22; background:#0B0D0F; transition:width .3s;"></div>
    </div>
    <div id="mStory" style="display:none; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(900px, 90vw); background:#F3EDE3; color:#1B1A17; border-radius:6px; padding:36px 40px; font-size:26px; line-height:1.45; box-shadow:0 30px 80px rgba(0,0,0,.6);"></div>
  </div>`;
  const CH = [['ECG II', '#5FD07A', 'HR', 'bpm'], ['SpO₂', '#33C8D6', 'SpO2', '%'], ['CO₂', '#F0C24A', 'EtCO2', 'mmHg'], ['NIBP', '#F07A63', 'BP', 'mmHg']];
  const grid = $('#mGrid'); const cv = [], val = {};
  CH.forEach(([lab, col, k, unit], i) => {

      case 'abg': case 'vbg': { const v = a === 'vbg'; const kv = [['pH', fmt(T.pH - (v ? 0.03 : 0), 2)], ['PCO₂', fmt(T.PaCO2 + (v ? 6 : 0))], ['PO₂', fmt(v ? 40 : T.PaO2)], ['HCO₃', fmt(T.HCO3 || 24, 1)], ['BE', fmt(((T.HCO3 || 24) - 24) * 1.2, 1)], ['Lactate', fmt(T.sys < 70 ? 3.5 : 1.2, 1)], ...(v ? [] : [['SaO₂', fmt(T.SpO2)], ['FiO₂', ((T.set && T.set.v && T.set.v.o) || 21) / 100]])];
        return reveal({ title: v ? 'Venous blood gas' : 'Arterial blood gas', kv }, (v ? 'VBG' : 'ABG') + ' released: pH ' + kv[0][1] + ', PCO₂ ' + kv[1][1] + ', PO₂ ' + kv[2][1]); }
      case 'cxr': { const [img, cap] = lastImg(); return reveal(img ? { title: 'Chest X-ray', img, text: cap } : { title: 'Chest X-ray', text: 'No new film at this stage.' }, 'Chest X-ray released'); }
      case 'heart': return reveal({ title: 'POCUS · heart', vid: C.pocus.heart[0], text: C.pocus.heart[1] }, 'POCUS heart released');
      case 'ivc': return reveal({ title: 'POCUS · IVC', ...(([vid, text]) => ({ vid, text }))(m.dry ? C.pocus.ev.dry : (m.fluid || 0) >= 3 ? C.pocus.ev.full : C.pocus.ivc) }, 'POCUS IVC released');
      case 'sub': return reveal({ title: 'POCUS · subcostal', vid: C.pocus.subcostal[0], text: C.pocus.subcostal[1] }, 'POCUS subcostal released');
      case 'lung': { const views = (m.ptx ? C.pocus.ev.ptx : C.pocus.lung).map(([vid, text], j) => ({ title: 'Lung ultrasound' + (m.ptx ? ' · ' + ['B-mode', 'M-mode'][j] : C.pocus.lung.length > 1 ? ' · view ' + (j + 1) : ''), vid, text, at: now() - j }));
        return act({ kind: 'reveal', reveals: [...(S.reveals || []), ...views.map(v => ({ at: now(), ...v }))], label: 'Lung ultrasound released' }); }
      case 'exam': return reveal({ title: 'Examination', text: st.exam.length ? st.exam.join('. ') + '.' : 'As before.' }, 'Examination released');
      case 'table': return reveal({ title: 'PEEP titration sheet', table: st.table, text: st.table.note }, 'Titration sheet released');
      case 'clear': return act({ kind: 'note', reveals: [], label: 'Results cleared' });
    }
  }
  listeners.push(render);
  setInterval(nums, 1000);
}

// ── start ──
if (!ROLE) landing(); else { ({ control, vent, monitor })[ROLE](); poll(); setInterval(poll, 1000); }
window.addEventListener('hashchange', () => location.reload());
})();
</script>
